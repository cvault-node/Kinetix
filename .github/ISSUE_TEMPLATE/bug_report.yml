name: Reporte de error
description: Informa de un fallo o comportamiento inesperado
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por tomarte el tiempo de reportar un error. Rellena los campos con el mayor detalle posible.
  - type: input
    id: version
    attributes:
      label: Versión de Kinetix
      description: Aparece en "Acerca de Kinetix" (F1) o en el nombre del archivo descargado.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Sistema operativo
      options:
        - Windows 11
        - Windows 10
        - Linux (AppImage)
        - Linux (DEB)
        - Otro
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Descripción del problema
      description: ¿Qué ocurre y qué esperabas que ocurriera?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Abrir...
        2. Hacer clic en...
        3. Ver el error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Capturas o registros (opcional)
      description: Arrastra aquí capturas de pantalla o pega cualquier mensaje de error.
    validations:
      required: false
